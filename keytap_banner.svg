<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <!-- State A Gradient (Emerald-to-Mint) -->
    <linearGradient id="gradA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- State B Gradient (Teal-to-Mint) -->
    <linearGradient id="gradB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <!-- Legibility Drop-Shadow Filter for Widescreen Contrast -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- 🐾 Swaying Premium Mechanical Keycap Brand Mark -->
    <g transform="translate(180, 150)">
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-6; 6; -6" dur="4.8s" repeatCount="indefinite"
          calcMode="spline" keyTimes="0; 0.5; 1" keySplines="0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1" />
        
        <!-- Keycap Outer Base Bevel -->
        <rect x="-42" y="-42" width="84" height="84" rx="22" fill="url(#gradA)" />
        <!-- Keycap Bezel Inner Frame -->
        <rect x="-34" y="-38" width="68" height="68" rx="16" fill="#141C12" />
        <!-- Keycap Top Dish Face -->
        <rect x="-28" y="-34" width="56" height="56" rx="12" fill="url(#gradB)" />
        <!-- Soundwave Glyphs debossed on Dish -->
        <path d="M-10,-12 C-4,-12 -2,-4 -2,0 C-2,4 -4,12 -10,12 M10,-12 C4,-12 2,-4 2,0 C2,4 4,12 10,12 M-18,-6 C-12,-6 -10,-2 -10,0 C-10,2 -12,6 -18,6 M18,-6 C12,-6 10,-2 10,0 C10,2 12,6 18,6" fill="none" stroke="#141C12" stroke-width="4" stroke-linecap="round" />
        <circle cx="0" cy="0" r="4" fill="#141C12" />
      </g>
    </g>

    <!-- 1. STATE A TEXT GROUP ("KeyTap") -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 40; 0 0; 0 0; 0 -40; 0 40; 0 40"
        dur="8s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0; 0.05; 0.375; 0.5; 0.875; 1"
        keySplines="0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1" />
      
      <text x="280" y="180" font-family="system-ui, -apple-system, sans-serif" font-size="94" font-weight="900" letter-spacing="18" fill="url(#gradA)">
        KeyTap
        <animate attributeName="opacity"
          values="0; 1; 1; 0; 0; 0"
          dur="8s" repeatCount="indefinite"
          calcMode="spline" keyTimes="0; 0.05; 0.375; 0.5; 0.875; 1"
          keySplines="0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1" />
      </text>
    </g>

    <!-- 2. STATE B TEXT GROUP ("Audio Keyboard") -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="0 -40; 0 40; 0 40; 0 0; 0 0; 0 -40"
        dur="8s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0; 0.05; 0.375; 0.5; 0.875; 1"
        keySplines="0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1" />
      
      <text x="280" y="172" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" letter-spacing="4" fill="url(#gradB)">
        Audio Keyboard
        <animate attributeName="opacity"
          values="0; 0; 0; 1; 1; 0"
          dur="8s" repeatCount="indefinite"
          calcMode="spline" keyTimes="0; 0.05; 0.375; 0.5; 0.875; 1"
          keySplines="0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1; 0.4, 0, 0.2, 1" />
      </text>
    </g>
  </g>
</svg>
